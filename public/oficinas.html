<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesquisar Oficinas - Oficina Fácil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Cabeçalho -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="/">Oficina <span>Fácil</span></a>
        <div class="collapse navbar-collapse justify-content-end" id="navMenu">
          <div id="navbar-auth-links" class="d-flex align-items-center">
            <a href="/login.html" class="btn btn-outline-primary btn-sm me-2">Entrar</a>
            <a href="/cadastro.html" class="btn btn-primary btn-sm">Cadastrar-se</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="text-center mb-5">
      <span class="badge bg-primary-subtle text-primary px-3 py-2 fs-6 rounded-pill mb-2">Busca Pública de Oficinas</span>
      <h1 class="display-5 fw-bold">Encontre a oficina ideal para o seu veículo</h1>
      <p class="lead text-muted">Pesquise por localização, estado ou serviços mecânicos disponíveis.</p>
    </div>

    <!-- Filtros de Busca -->
    <div class="card auth-card p-4 mb-4">
      <form id="form-busca" class="row g-3 align-items-end">
        <div class="col-md-5">
          <label for="filtro-cidade" class="form-label fw-semibold">Cidade</label>
          <input type="text" class="form-control" id="filtro-cidade" placeholder="Ex: Brasília, Goiânia...">
        </div>

        <div class="col-md-2">
          <label for="filtro-uf" class="form-label fw-semibold">UF</label>
          <select class="form-select" id="filtro-uf">
            <option value="">Todas</option>
            <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option>
            <option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option>
            <option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option>
            <option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option>
            <option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option>
            <option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option>
            <option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option>
            <option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option>
            <option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
          </select>
        </div>

        <div class="col-md-3">
          <label for="filtro-servico" class="form-label fw-semibold">Tipo de Serviço</label>
          <input type="text" class="form-control" id="filtro-servico" placeholder="Ex: Freio, Troca de Óleo...">
        </div>

        <div class="col-md-2 d-grid">
          <button type="submit" class="btn btn-primary">Buscar</button>
        </div>
      </form>
    </div>

    <!-- Resultados -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h5 fw-bold mb-0">Resultados Encontrados</h2>
      <span id="contador-resultados" class="text-muted small">Carregando...</span>
    </div>

    <div id="container-resultados" class="row g-4">
      <!-- Preenchido via JavaScript -->
    </div>
  </main>

  <footer class="py-3 text-center text-muted">
    <div class="container small">&copy; 2026 Oficina Fácil — Todos os direitos reservados.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    async function carregarOficinas() {
      const cidade = document.getElementById('filtro-cidade').value.trim();
      const uf = document.getElementById('filtro-uf').value.trim();
      const servico = document.getElementById('filtro-servico').value.trim();

      const params = new URLSearchParams();
      if (cidade) params.append('cidade', cidade);
      if (uf) params.append('uf', uf);
      if (servico) params.append('servico', servico);

      const container = document.getElementById('container-resultados');
      const contador = document.getElementById('contador-resultados');
      container.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary" role="status"></div><p class="text-muted mt-2">Buscando oficinas...</p></div>';

      try {
        const res = await fetch(`/api/oficinas?${params.toString()}`);
        const data = await res.json();
        const oficinas = data.oficinas || [];

        contador.textContent = `${oficinas.length} oficina(s) encontrada(s)`;

        if (oficinas.length === 0) {
          container.innerHTML = `
            <div class="col-12">
              <div class="alert alert-info text-center py-5 auth-card">
                <h3 class="h5 fw-bold">Nenhuma oficina encontrada</h3>
                <p class="text-muted mb-0">Não encontramos oficinas para os filtros selecionados. Tente ajustar a cidade, o estado ou o serviço.</p>
              </div>
            </div>
          `;
          return;
        }

        container.innerHTML = oficinas.map(o => {
          const servicosBadges = o.servicos && o.servicos.length > 0
            ? o.servicos.map(s => `<span class="badge bg-light text-dark border me-1 mb-1">${s}</span>`).join('')
            : '<span class="text-muted small">Nenhum serviço público cadastrado ainda.</span>';

          return `
            <div class="col-md-6 col-lg-4">
              <div class="card auth-card h-100 p-4 d-flex flex-column">
                <div class="mb-3">
                  <h3 class="h5 fw-bold text-primary mb-1">${o.nomeFantasia}</h3>
                  <div class="text-muted small">${o.cidade} / ${o.uf} ${o.bairro ? '— ' + o.bairro : ''}</div>
                </div>

                <p class="text-muted small mb-3 flex-grow-1">${o.descricao || 'Sem descrição cadastrada.'}</p>

                <div class="mb-3">
                  <strong class="small d-block text-secondary mb-1">Serviços Oferecidos:</strong>
                  <div class="d-flex flex-wrap">${servicosBadges}</div>
                </div>

                <div class="pt-3 border-top d-flex justify-content-between align-items-center">
                  <span class="small text-muted">${o.telefone || 'Telefone sob consulta'}</span>
                  <a href="/oficina.html?id=${o.id}" class="btn btn-outline-primary btn-sm">Ver Detalhes</a>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (error) {
        container.innerHTML = '<div class="col-12 alert alert-danger">Erro ao carregar oficinas do servidor.</div>';
      }
    }

    document.getElementById('form-busca').addEventListener('submit', (e) => {
      e.preventDefault();
      carregarOficinas();
    });

    document.addEventListener('DOMContentLoaded', carregarOficinas);
  </script>
</body>
</html>
