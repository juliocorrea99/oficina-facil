<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Oficina Fácil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Cabeçalho -->
  <header>
    <nav class="navbar navbar-light bg-white border-bottom shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="/">Oficina <span>Fácil</span></a>
        <a href="/cadastro.html" class="btn btn-outline-primary btn-sm">Criar conta</a>
      </div>
    </nav>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card auth-card p-4 p-md-5">
          <div class="text-center auth-header">
            <h1 class="h3 fw-bold mb-1">Acessar Conta</h1>
            <p class="text-muted small mb-0">Digite seu e-mail e senha para entrar na plataforma</p>
          </div>

          <div id="alerta-login" class="alert-container mb-3" aria-live="polite"></div>

          <form id="form-login" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label">E-mail</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="seu.email@exemplo.com"
                required
                autocomplete="email"
              >
            </div>

            <div class="mb-4">
              <label for="senha" class="form-label">Senha</label>
              <div class="input-group">
                <input
                  type="password"
                  class="form-control"
                  id="senha"
                  name="senha"
                  placeholder="Sua senha secreta"
                  required
                  autocomplete="current-password"
                >
                <button
                  type="button"
                  id="btn-toggle-senha"
                  class="btn btn-outline-secondary"
                  aria-label="Alternar exibição da senha"
                >Mostrar</button>
              </div>
            </div>

            <div class="d-grid mb-3">
              <button type="submit" id="btn-submit-login" class="btn btn-primary btn-lg">
                Entrar
              </button>
            </div>

            <div class="text-center mt-3">
              <span class="text-muted small">Não possui uma conta?</span>
              <a href="/cadastro.html" class="small fw-semibold text-decoration-none">Cadastre-se gratuitamente</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- Rodapé -->
  <footer class="py-3 text-center text-muted">
    <div class="container small">
      &copy; 2026 Oficina Fácil — Todos os direitos reservados.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
