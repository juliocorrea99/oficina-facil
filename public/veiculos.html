<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus Veículos — Oficina Fácil</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head>
<body><nav class="navbar bg-white border-bottom"><div class="container"><a class="navbar-brand" href="/">Oficina <span>Fácil</span></a><a class="btn btn-outline-primary btn-sm" href="/dashboard.html">Meu Painel</a></div></nav>
<main class="container my-5" style="max-width:1050px">
  <header class="mb-4"><h1 class="h2 fw-bold">Meus veículos</h1><p class="text-muted">Cadastre os veículos que poderão ser utilizados nos agendamentos.</p></header>
  <div id="alerta-veiculos" aria-live="polite"></div>
  <section class="card auth-card p-4 mb-4"><h2 id="titulo-form" class="h5">Cadastrar veículo</h2>
    <form id="form-veiculo" class="row g-3">
      <div class="col-md-3"><label for="placa" class="form-label">Placa *</label><input id="placa" class="form-control text-uppercase" maxlength="8" placeholder="ABC1D23" required></div>
      <div class="col-md-3"><label for="marca" class="form-label">Marca *</label><input id="marca" class="form-control" maxlength="80" placeholder="Ex.: Fiat" required></div>
      <div class="col-md-3"><label for="modelo" class="form-label">Modelo *</label><input id="modelo" class="form-control" maxlength="100" placeholder="Ex.: Argo" required></div>
      <div class="col-md-3"><label for="ano" class="form-label">Ano</label><input id="ano" type="number" min="1886" max="2100" class="form-control" placeholder="Ex.: 2022"></div>
      <div class="col-md-6"><label for="apelido" class="form-label">Apelido (opcional)</label><input id="apelido" class="form-control" maxlength="80" placeholder="Ex.: Carro da família"></div>
      <div class="col-12 d-flex gap-2"><button id="salvar" type="submit" class="btn btn-primary">Cadastrar veículo</button><button id="cancelar" type="button" class="btn btn-outline-secondary d-none">Cancelar edição</button></div>
    </form>
  </section>
  <section class="card auth-card p-4"><h2 class="h5 mb-3">Veículos cadastrados</h2><div id="lista" aria-live="polite" class="table-responsive">Carregando...</div></section>
</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/auth.js"></script><script src="/js/veiculos.js"></script></body></html>
