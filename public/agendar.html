<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agendar Atendimento — Oficina Fácil</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head>
<body><nav class="navbar bg-white border-bottom"><div class="container"><a class="navbar-brand" href="/">Oficina <span>Fácil</span></a><a href="/oficinas.html" class="btn btn-outline-primary btn-sm">Buscar Oficinas</a></div></nav>
<main class="container my-5" style="max-width:920px"><h1 class="h2 fw-bold">Agendar atendimento</h1><p class="text-muted">Escolha seu veículo, serviço, dia e horário. A reserva só é confirmada após verificar as vagas.</p>
  <div id="alerta-agendamento" aria-live="polite"></div>
  <section class="card auth-card p-4 mb-4"><h2 id="nome-oficina" class="h5">Carregando oficina...</h2>
    <form id="form-agendar" class="row g-3">
      <div class="col-md-6"><label for="veiculo" class="form-label">Seu veículo *</label><select id="veiculo" class="form-select" required><option value="">Selecione um veículo</option></select><small class="text-muted"><a href="/veiculos.html">Cadastrar outro veículo</a></small></div>
      <div class="col-md-6"><label for="servico" class="form-label">Serviço *</label><select id="servico" class="form-select" required><option value="">Selecione um serviço</option></select></div>
      <div class="col-md-6"><label for="data" class="form-label">Data *</label><input id="data" type="date" class="form-control" required></div>
      <div class="col-md-6"><label for="horario" class="form-label">Horário disponível *</label><select id="horario" class="form-select" required disabled><option value="">Escolha serviço e data</option></select></div>
      <div class="col-12"><label for="observacoes" class="form-label">Observações (opcional)</label><textarea id="observacoes" maxlength="500" rows="3" class="form-control" placeholder="Descreva brevemente a necessidade do veículo"></textarea></div>
      <div class="col-12"><button id="confirmar" type="submit" class="btn btn-primary">Confirmar agendamento</button><a class="btn btn-outline-secondary ms-2" href="/agendamentos.html">Meus agendamentos</a></div>
    </form>
  </section>
</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/auth.js"></script><script src="/js/agendar.js"></script></body></html>
